<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Palaces — Story Palace</title>
<meta name="description" content="Pre-built non-visual story and spatial palaces with adaptive zero-imagery prompts, Lukasa spatial map, spaced repetition, and active recall.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23b4531f'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='Georgia'>1</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="header"></div>
<main class="wrap" id="main"></main>
<div id="footer"></div>

<script src="assets/palaces.js"></script>
<script src="assets/app.js"></script>
<script>
"use strict";
document.getElementById("header").outerHTML = renderHeader("palace.html");
document.getElementById("footer").outerHTML = renderFooter();

const main = document.getElementById("main");
const params = new URLSearchParams(location.search);

window.addEventListener("beforeunload", stopSpeaking);

function renderLensControl(store, onChange) {
    const pref = store.prefs.encodingMode || "auto";
    const eff = effectiveEncodingMode(store);
    const autoNote = eff === "logic-only" ? "Auto (Zero-imagery)" : "Auto (Balanced)";
    const html = `
      <label class="muted" style="display:inline-flex;align-items:center;gap:.4rem;margin:0;font-size:.85rem;font-weight:600">
        Lens:
        <select id="encoding-lens" style="width:auto;padding:.28rem .5rem;font-size:.84rem">
          <option value="auto" ${pref === "auto" ? "selected" : ""}>${autoNote}</option>
          <option value="balanced" ${pref === "balanced" ? "selected" : ""}>Balanced sensory + logic</option>
          <option value="logic-only" ${pref === "logic-only" ? "selected" : ""}>Zero-imagery (logic + action)</option>
        </select>
      </label>`;
    return {
        html,
        bind() {
            const sel = document.getElementById("encoding-lens");
            if (!sel) return;
            sel.onchange = () => {
                const s = loadStore();
                s.prefs.encodingMode = sel.value;
                saveStore(s);
                const hdr = document.querySelector("header.site");
                if (hdr) hdr.outerHTML = renderHeader("palace.html");
                onChange();
            };
        },
    };
}

/* ---------- View: palace picker ---------- */

function viewPicker() {
    stopSpeaking();
    const store = loadStore();
    const profile = getUserProfile(store);
    const recIds = recommendedPalaceIds(profile);
    const lens = renderLensControl(store, viewPicker);

    const cards = allPalaces(store).map((p) => {
        const lists = listsForPalace(store, p.id);
        const totalDue = lists.reduce((acc, l) => acc + dueCountForList(p, l), 0);
        const isRec = recIds.includes(p.id);
        return `
        <div class="card">
          <h3>${escapeHtml(p.name)}
            ${p.custom ? '<span class="chip accent">custom</span>' : ""}
            ${isRec ? '<span class="chip good">fits your profile</span>' : ""}
          </h3>
          <p class="muted">${escapeHtml(p.tagline)}</p>
          <p class="muted" style="font-size:.85rem">
            ${lists.length} list${lists.length === 1 ? "" : "s"} stored
            ${totalDue > 0 ? ` · <span class="chip warn">${totalDue} hook${totalDue === 1 ? "" : "s"} due</span>` : ""}
          </p>
          <div class="toolbar" style="margin-bottom:0">
            <a class="btn primary" href="palace.html?p=${encodeURIComponent(p.id)}">Enter</a>
            ${p.custom ? `<a class="btn" href="builder.html?edit=${encodeURIComponent(p.id)}">Edit</a>` : ""}
          </div>
        </div>`;
    }).join("");

    main.innerHTML = `
      <div class="toolbar" style="padding-top:1.75rem">
        <h1 style="margin:0">Choose a palace</h1>
        <span class="spacer"></span>
        ${lens.html}
      </div>
      <p style="max-width:44em">Each palace is a fixed route of numbered hooks —
      built on physical enactment, blindfolded spatial coordinates, rhyme pegs,
      or cause-and-effect chains. Switch to <strong>Zero-imagery</strong> lens
      anytime if you also lack imagined sound, smell, or touch.</p>
      ${!profile ? `<div class="callout">Want automatic recommendations? <a href="assess.html">Take the 3-minute multi-sensory self-check</a> so palaces tailor to your strongest channels.</div>` : ""}
      <div class="grid">${cards}
        <div class="card" style="display:flex;flex-direction:column;justify-content:center;align-items:flex-start">
          <h3>Build your own</h3>
          <p class="muted">Turn your home, commute, ritual, or desk Lukasa into a reusable non-visual palace.</p>
          <a class="btn" href="builder.html">Open the builder</a>
        </div>
      </div>
      <h2>Your data</h2>
      <p class="toolbar">
        <button id="export-json">Download backup (JSON)</button>
        <button id="import-json">Restore from backup</button>
        <input type="file" id="import-file" accept="application/json" class="sr-only">
        <span class="muted" id="data-status" role="status"></span>
      </p>`;

    lens.bind();
    document.getElementById("export-json").onclick = () => exportAllJson(loadStore());
    const fileInput = document.getElementById("import-file");
    document.getElementById("import-json").onclick = () => fileInput.click();
    fileInput.onchange = () => {
        if (!fileInput.files[0]) return;
        importAllJson(fileInput.files[0], (err) => {
            document.getElementById("data-status").textContent =
                err ? "Import failed: " + err.message : "Backup restored.";
            if (!err) setTimeout(() => location.reload(), 600);
        });
    };
}

/* ---------- View: palace detail (story + lists + route dry-run) ---------- */

function viewPalace(palace) {
    stopSpeaking();
    const store = loadStore();
    const mode = effectiveEncodingMode(store);
    const lists = listsForPalace(store, palace.id);
    const lens = renderLensControl(store, () => viewPalace(palace));

    const storyRows = palace.hooks.map((h) => `
      <div class="hookrow" id="route-row-${h.n}">
        <span class="hooknum">${h.n}</span>
        <div class="body">
          <span class="hookname">${escapeHtml(h.label)}</span> ${hookTypeChip(h.type)}
          <p class="story" style="margin-bottom:${h.enact ? ".25rem" : "0"}">${hookBeatForMode(h, mode)}</p>
          ${h.enact ? `<div class="enact-cue"><strong>Do it:</strong> ${escapeHtml(h.enact)}</div>` : ""}
        </div>
      </div>`).join("");

    const listRows = lists.map((l) => {
        const filled = palace.hooks.filter((h) => l.entries[h.n] && l.entries[h.n].item.trim()).length;
        const due = dueCountForList(palace, l);
        return `
        <div class="hookrow">
          <div class="body">
            <span class="hookname">${escapeHtml(l.name)}</span>
            <span class="chip">${filled}/${palace.hooks.length} hooks filled</span>
            ${due > 0 ? `<span class="chip warn">${due} due</span>` : (filled > 0 ? '<span class="chip good">up to date</span>' : "")}
          </div>
          <a class="btn primary" href="palace.html?p=${encodeURIComponent(palace.id)}&l=${encodeURIComponent(l.id)}">Open</a>
          <button class="bad" data-del="${escapeHtml(l.id)}">Delete</button>
        </div>`;
    }).join("");

    main.innerHTML = `
      <div class="toolbar" style="padding-top:1.5rem">
        <a href="palace.html">← All palaces</a>
        <span class="spacer"></span>
        ${lens.html}
      </div>
      <h1>${escapeHtml(palace.name)}</h1>
      <p class="muted">${escapeHtml(palace.tagline)}</p>
      <p style="max-width:44em">${escapeHtml(palace.intro || "")}</p>

      <h2>Your lists in this palace</h2>
      <div class="card">
        ${listRows || '<p class="muted" style="margin:0">No lists yet — every list is an independent set of items riding on the same hooks.</p>'}
      </div>
      <p class="toolbar">
        <input type="text" id="new-list-name" placeholder="Name a new list (e.g. Groceries, Exam terms, Speech points)" style="max-width:24rem">
        <button class="primary" id="new-list">＋ Create list</button>
      </p>

      <h2>The hook route <span class="chip">${palace.hooks.length} hooks</span></h2>
      <p class="muted" style="max-width:44em">Cognitive tip: learn the hook route <em>before</em> injecting items so the anchor never competes with the payload. Perform each physical gesture for real (Enactment Effect) and say the hook aloud (Production Effect).</p>
      <p class="toolbar">
        <button id="dry-run-btn">▶ Practice the route itself (dry run)</button>
        ${speechSupported() ? '<button id="speak-route">♪ Read route aloud</button>' : ""}
      </p>
      <section id="dry-run-stage" hidden></section>
      <div class="card">${storyRows}</div>`;

    lens.bind();

    document.getElementById("new-list").onclick = () => {
        const nameInput = document.getElementById("new-list-name");
        const name = nameInput.value.trim();
        if (!name) { nameInput.focus(); return; }
        const s = loadStore();
        const list = {
            id: uid(), palaceId: palace.id, name,
            entries: {}, stats: { perHook: {}, sessions: 0 },
            createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
        };
        s.lists.push(list);
        saveStore(s);
        location.search = `?p=${encodeURIComponent(palace.id)}&l=${encodeURIComponent(list.id)}`;
    };

    main.querySelectorAll("button[data-del]").forEach((btn) => {
        btn.onclick = () => {
            const s = loadStore();
            const l = s.lists.find((x) => x.id === btn.dataset.del);
            if (!l) return;
            if (!confirm(`Delete the list “${l.name}”? This cannot be undone.`)) return;
            s.lists = s.lists.filter((x) => x.id !== btn.dataset.del);
            saveStore(s);
            viewPalace(palace);
        };
    });

    /* Dry-run quiz: learn the hooks 1..N without items */
    document.getElementById("dry-run-btn").onclick = () => {
        const stage = document.getElementById("dry-run-stage");
        stage.hidden = false;
        let idx = 0;
        let ok = 0;
        function step() {
            if (idx >= palace.hooks.length) {
                stage.innerHTML = `<div class="card practice-stage">
                  <h3 style="margin-top:0">Route dry run complete: ${ok}/${palace.hooks.length}</h3>
                  <p class="muted">Once the hooks come back automatically, create a list above and inject your items.</p>
                  <button class="primary" id="dr-again">Walk route again</button>
                  <button id="dr-close">Close</button>
                </div>`;
                document.getElementById("dr-again").onclick = () => { idx = 0; ok = 0; step(); };
                document.getElementById("dr-close").onclick = () => { stage.hidden = true; };
                return;
            }
            const h = palace.hooks[idx];
            const prev = idx > 0 ? palace.hooks[idx - 1] : null;
            stage.innerHTML = `<div class="card practice-stage">
              <div class="progressbar"><div style="width:${(idx / palace.hooks.length) * 100}%"></div></div>
              <p class="muted" style="margin:0">Route rehearsal · Stop ${h.n} of ${palace.hooks.length}</p>
              <p class="beat"><span class="hooknum">${h.n}</span><br>${prev ? `After <strong>${escapeHtml(prev.label)}</strong>, what is stop ${h.n}?` : "What is stop 1?"}</p>
              <p class="muted">Say the hook name and do its gesture aloud, then check.</p>
              <div id="dr-ans"><button class="primary" id="dr-reveal">Reveal hook</button></div>
            </div>`;
            document.getElementById("dr-reveal").onclick = () => {
                document.getElementById("dr-ans").innerHTML = `
                  <div class="reveal-box">
                    <strong>${h.n}. ${escapeHtml(h.label)}</strong> ${hookTypeChip(h.type)}<br>
                    <span class="muted">${hookBeatForMode(h, mode)}</span>
                    ${h.enact ? `<br><small><strong>Do it:</strong> ${escapeHtml(h.enact)}</small>` : ""}
                  </div>
                  <button class="good" id="dr-ok">✓ Knew it</button>
                  <button class="bad" id="dr-miss">✗ Missed</button>`;
                document.getElementById("dr-ok").onclick = () => { ok++; idx++; step(); };
                document.getElementById("dr-miss").onclick = () => { idx++; step(); };
            };
        }
        step();
        stage.scrollIntoView({ behavior: "smooth" });
    };

    /* Optional Audio Walk */
    const speakBtn = document.getElementById("speak-route");
    if (speakBtn) {
        let playing = false;
        speakBtn.onclick = () => {
            if (playing) {
                stopSpeaking();
                playing = false;
                speakBtn.textContent = "♪ Read route aloud";
                main.querySelectorAll(".hookrow.speaking").forEach((r) => r.classList.remove("speaking"));
                return;
            }
            playing = true;
            speakBtn.textContent = "■ Stop reading";
            const items = palace.hooks.map((h) => ({
                n: h.n,
                text: `Hook ${h.n}, ${h.label}. ${hookBeatForMode(h, mode).replace(/<[^>]+>/g, "")}`,
            }));
            speakSequence(items, {
                onStep: (_, item) => {
                    main.querySelectorAll(".hookrow.speaking").forEach((r) => r.classList.remove("speaking"));
                    const row = document.getElementById("route-row-" + item.n);
                    if (row) { row.classList.add("speaking"); row.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
                },
                onEnd: () => {
                    playing = false;
                    speakBtn.textContent = "♪ Read route aloud";
                    main.querySelectorAll(".hookrow.speaking").forEach((r) => r.classList.remove("speaking"));
                },
            });
        };
    }
}

/* ---------- View: list editor + Lukasa Map + Practice ---------- */

let activeListView = "editor"; // "editor" | "lukasa"

function viewList(palace, listId) {
    stopSpeaking();
    const store = loadStore();
    const list = store.lists.find((l) => l.id === listId);
    if (!list) { location.search = `?p=${encodeURIComponent(palace.id)}`; return; }

    const profile = getUserProfile(store);
    const mode = effectiveEncodingMode(store);
    const frames = framesForMode(mode);
    const dueCount = dueCountForList(palace, list);
    const lens = renderLensControl(store, () => viewList(palace, listId));

    const rows = palace.hooks.map((h) => {
        const entry = list.entries[h.n] || { item: "", assoc: "" };
        const stat = (list.stats && list.stats.perHook && list.stats.perHook[h.n]) || null;
        const dueBadge = entry.item.trim()
            ? (stat && stat.total
                ? `<span class="chip ${isSrsDue(stat) ? "warn" : "good"}">${Math.round((stat.ok / stat.total) * 100)}% · ${formatNextDue(stat)}</span>`
                : '<span class="chip">untested</span>')
            : "";
        return `
        <div class="hookrow" id="edit-row-${h.n}">
          <span class="hooknum">${h.n}</span>
          <div class="body">
            <div style="display:flex;gap:.4rem;align-items:center;flex-wrap:wrap">
              <span class="hookname">${escapeHtml(h.label)}</span>
              ${hookTypeChip(h.type)}
              ${dueBadge}
            </div>
            <p class="story">${hookBeatForMode(h, mode)}</p>
            ${h.enact ? `<div class="enact-cue"><strong>Enact it:</strong> ${escapeHtml(h.enact)}</div>` : ""}
            <label for="item-${h.n}">Item to remember</label>
            <input type="text" id="item-${h.n}" data-n="${h.n}" data-field="item"
                   value="${escapeHtml(entry.item)}" placeholder="e.g. olive oil, photosynthesis, 1789">
            <label for="assoc-${h.n}">Association — connect it to <em>${escapeHtml(h.label)}</em> (no visualization needed)</label>
            <div class="frames" role="group" aria-label="Sentence starters">
              ${frames.map((f, fi) =>
                `<button type="button" class="chip-btn" data-frame="${fi}" data-fn="${h.n}">${escapeHtml(f.label)}</button>`).join("")}
            </div>
            <textarea id="assoc-${h.n}" data-n="${h.n}" data-field="assoc" rows="2"
                      placeholder="${escapeHtml(promptForHook(h, mode, profile))}">${escapeHtml(entry.assoc)}</textarea>
            <div class="coach" id="coach-${h.n}" role="status"></div>
          </div>
        </div>`;
    }).join("");

    main.innerHTML = `
      <div class="toolbar" style="padding-top:1.5rem">
        <a href="palace.html?p=${encodeURIComponent(palace.id)}">← ${escapeHtml(palace.name)}</a>
        <span class="spacer"></span>
        ${lens.html}
      </div>
      <h1>${escapeHtml(list.name)}</h1>
      <p class="muted" style="max-width:44em">
        ${mode === "logic-only"
            ? "<strong>Zero-imagery lens active:</strong> skip chasing any mental pictures, sounds, or smells. Bind each item with a real gesture, causal rule, contrast, or wordplay, and say the link aloud."
            : "Attach one item per hook. Skip pictures — bind the item using cause-and-effect, physical enactment, contrast, wordplay, or non-visual sensory hooks. Say each link aloud once as you type it."}
      </p>
      <p class="toolbar">
        <button class="primary" id="go-practice">▶ Practice recall ${dueCount > 0 ? `(${dueCount} due)` : ""}</button>
        ${speechSupported() ? '<button id="audio-walk">♪ Read list aloud</button>' : ""}
        <button id="export-anki">Anki CSV</button>
        <button id="export-md">Markdown sheet</button>
        <span class="spacer"></span>
        <span class="muted" id="save-status" role="status">Saved</span>
      </p>

      <div class="tabs">
        <button type="button" id="view-editor-btn" aria-pressed="${activeListView === "editor"}">List editor</button>
        <button type="button" id="view-lukasa-btn" aria-pressed="${activeListView === "lukasa"}">⌖ Lukasa spatial map</button>
      </div>

      <div id="editor-panel" ${activeListView === "editor" ? "" : "hidden"}>
        <div class="card">${rows}</div>
      </div>

      <div id="lukasa-panel" ${activeListView === "lukasa" ? "" : "hidden"}>
        <div class="card">
          <p class="muted" style="margin-top:0">Inspired by Lynne Kelly's tactile <em>lukasa</em> memory boards and 2025 research showing simple symbols beat rich photos for aphantasic memory. Click any tile to peek at its link or jump to edit it.</p>
          <div class="toolbar" style="margin-top:0;font-size:.82rem">
            <span class="chip">Border key:</span>
            <span class="chip accent">untested</span>
            <span class="chip warn">due for review</span>
            <span class="chip">learning</span>
            <span class="chip good">strong</span>
            <span class="spacer"></span>
            <button type="button" class="chip-btn" id="lukasa-hide-toggle">Hide items (self-test grid)</button>
          </div>
          <div class="lukasa-grid" id="lukasa-grid"></div>
          <div id="lukasa-detail"></div>
        </div>
      </div>

      <p class="toolbar">
        <button class="primary" id="go-practice-2">▶ Practice recall</button>
      </p>
      <section id="practice" hidden></section>`;

    lens.bind();

    /* Debounced autosave */
    let saveTimer = null;
    const pending = new Map();
    function flushPending() {
        clearTimeout(saveTimer);
        if (pending.size === 0) return;
        const s = loadStore();
        const l = s.lists.find((x) => x.id === listId);
        if (!l) return;
        for (const [key, value] of pending) {
            const [n, field] = key.split(":");
            l.entries[n] = l.entries[n] || { item: "", assoc: "" };
            l.entries[n][field] = value;
        }
        pending.clear();
        l.updatedAt = new Date().toISOString();
        saveStore(s);
        const st = document.getElementById("save-status");
        if (st) st.textContent = "Saved";
    }

    main.querySelectorAll("input[data-n], textarea[data-n]").forEach((el) => {
        el.addEventListener("input", () => {
            pending.set(el.dataset.n + ":" + el.dataset.field, el.value);
            document.getElementById("save-status").textContent = "Saving…";
            clearTimeout(saveTimer);
            saveTimer = setTimeout(flushPending, 400);
            updateCoach(el.dataset.n);
        });
    });
    window.addEventListener("beforeunload", flushPending);

    function updateCoach(n) {
        const hook = palace.hooks.find((h) => String(h.n) === String(n));
        const coach = document.getElementById("coach-" + n);
        if (!hook || !coach) return;
        const item = document.getElementById("item-" + n).value.trim();
        const assoc = document.getElementById("assoc-" + n).value;
        renderCoachFeedback(coach, analyzeLink(assoc, item, hook.label));
    }
    palace.hooks.forEach((h) => updateCoach(h.n));

    /* One-tap sentence frames */
    main.querySelectorAll("button[data-frame]").forEach((btn) => {
        btn.onclick = () => {
            const n = btn.dataset.fn;
            const hook = palace.hooks.find((h) => String(h.n) === String(n));
            const assocEl = document.getElementById("assoc-" + n);
            if (assocEl.value.trim()) { assocEl.focus(); return; }
            const item = document.getElementById("item-" + n).value.trim() || "item";
            assocEl.value = frames[Number(btn.dataset.frame)].text
                .replaceAll("{hook}", hook.label)
                .replaceAll("{item}", item);
            assocEl.dispatchEvent(new Event("input", { bubbles: true }));
            assocEl.focus();
            assocEl.setSelectionRange(assocEl.value.length, assocEl.value.length);
        };
    });

    /* Lukasa Spatial Map renderer */
    let hideGridItems = false;
    function renderLukasa() {
        flushPending();
        const s = loadStore();
        const l = s.lists.find((x) => x.id === listId);
        const grid = document.getElementById("lukasa-grid");
        const detail = document.getElementById("lukasa-detail");
        const perHook = (l.stats && l.stats.perHook) || {};
        grid.innerHTML = palace.hooks.map((h) => {
            const entry = l.entries[h.n] || { item: "", assoc: "" };
            const hasItem = Boolean(entry.item && entry.item.trim());
            const tier = hasItem ? masteryTier(perHook[h.n]) : "empty";
            const t = HOOK_TYPES[h.type] || { glyph: "·" };
            return `
              <button type="button" class="lukasa-tile m-${tier}" data-tile="${h.n}">
                <div class="lt-top"><span>#${h.n}</span><span class="lt-glyph">${t.glyph}</span></div>
                <div class="lt-hook">${escapeHtml(h.label)}</div>
                <div class="lt-item">${hasItem ? (hideGridItems ? "•••••" : escapeHtml(entry.item)) : '<span class="muted">empty</span>'}</div>
                ${hasItem ? `<div class="lt-due">${formatNextDue(perHook[h.n])}</div>` : ""}
              </button>`;
        }).join("");

        grid.querySelectorAll("button[data-tile]").forEach((btn) => {
            btn.onclick = () => {
                const n = Number(btn.dataset.tile);
                const h = palace.hooks.find((x) => x.n === n);
                const entry = l.entries[n] || { item: "", assoc: "" };
                detail.innerHTML = `
                  <div class="callout" style="margin-top:1rem">
                    <strong>#${h.n} · ${escapeHtml(h.label)}</strong> ${hookTypeChip(h.type)}<br>
                    ${entry.item ? `<strong>Item:</strong> ${escapeHtml(entry.item)}<br>` : '<span class="muted">No item placed here yet.</span><br>'}
                    ${entry.assoc ? `<span>${escapeHtml(entry.assoc)}</span><br>` : ""}
                    <span class="muted" style="font-style:italic">${hookBeatForMode(h, mode)}</span>
                    ${h.enact ? `<br><small><strong>Enact:</strong> ${escapeHtml(h.enact)}</small>` : ""}
                    <div style="margin-top:.5rem">
                      <button type="button" class="chip-btn" id="jump-edit">Edit this hook</button>
                    </div>
                  </div>`;
                document.getElementById("jump-edit").onclick = () => {
                    switchListView("editor");
                    const row = document.getElementById("edit-row-" + n);
                    if (row) { row.scrollIntoView({ behavior: "smooth", block: "center" }); document.getElementById("item-" + n).focus(); }
                };
            };
        });
    }

    function switchListView(which) {
        activeListView = which;
        document.getElementById("editor-panel").hidden = which !== "editor";
        document.getElementById("lukasa-panel").hidden = which !== "lukasa";
        document.getElementById("view-editor-btn").setAttribute("aria-pressed", String(which === "editor"));
        document.getElementById("view-lukasa-btn").setAttribute("aria-pressed", String(which === "lukasa"));
        if (which === "lukasa") renderLukasa();
    }
    document.getElementById("view-editor-btn").onclick = () => switchListView("editor");
    document.getElementById("view-lukasa-btn").onclick = () => switchListView("lukasa");
    document.getElementById("lukasa-hide-toggle").onclick = (e) => {
        hideGridItems = !hideGridItems;
        e.target.textContent = hideGridItems ? "Show items" : "Hide items (self-test grid)";
        renderLukasa();
    };
    if (activeListView === "lukasa") renderLukasa();

    /* Audio walk of filled items */
    const audioBtn = document.getElementById("audio-walk");
    if (audioBtn) {
        let playing = false;
        audioBtn.onclick = () => {
            flushPending();
            if (playing) {
                stopSpeaking();
                playing = false;
                audioBtn.textContent = "♪ Read list aloud";
                main.querySelectorAll(".hookrow.speaking").forEach((r) => r.classList.remove("speaking"));
                return;
            }
            const s = loadStore();
            const l = s.lists.find((x) => x.id === listId);
            const items = palace.hooks
                .filter((h) => l.entries[h.n] && l.entries[h.n].item.trim())
                .map((h) => {
                    const e = l.entries[h.n];
                    return {
                        n: h.n,
                        text: `Hook ${h.n}, ${h.label}. Item: ${e.item}. ${e.assoc || ""}`,
                    };
                });
            if (!items.length) return;
            playing = true;
            audioBtn.textContent = "■ Stop reading";
            speakSequence(items, {
                onStep: (_, item) => {
                    main.querySelectorAll(".hookrow.speaking").forEach((r) => r.classList.remove("speaking"));
                    const row = document.getElementById("edit-row-" + item.n);
                    if (row) { row.classList.add("speaking"); row.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
                },
                onEnd: () => {
                    playing = false;
                    audioBtn.textContent = "♪ Read list aloud";
                    main.querySelectorAll(".hookrow.speaking").forEach((r) => r.classList.remove("speaking"));
                },
            });
        };
    }

    document.getElementById("export-anki").onclick = () => {
        flushPending();
        const s = loadStore();
        exportListAsAnkiCsv(palace, s.lists.find((x) => x.id === listId));
    };
    document.getElementById("export-md").onclick = () => {
        flushPending();
        const s = loadStore();
        exportListAsMarkdown(palace, s.lists.find((x) => x.id === listId), mode);
    };
    const startPractice = () => { flushPending(); beginPractice(palace, listId); };
    document.getElementById("go-practice").onclick = startPractice;
    document.getElementById("go-practice-2").onclick = startPractice;
}

/* ---------- Practice Engine (Spaced Repetition + Bidirectional + Inline Rework) ---------- */

const MODES = {
    smart: "Smart review — due & weakest hooks first",
    forward: "Forward — start to finish",
    reverse: "Reverse — walk backwards",
    randomstart: "Random start — drop in mid-route",
    shuffle: "Jump quiz — random order",
};

const CUE_ORDER = ["full", "hooktype", "hook", "number"];
const CUE_LABELS = {
    full: "Full beat + action (easiest)",
    hooktype: "Hook word + type glyph",
    hook: "Hook word only",
    number: "Number only (pure index, hardest)",
};

function beginPractice(palace, listId) {
    stopSpeaking();
    const store = loadStore();
    const list = store.lists.find((l) => l.id === listId);
    const filled = palace.hooks.filter((h) => list.entries[h.n] && list.entries[h.n].item.trim());
    const section = document.getElementById("practice");
    section.hidden = false;

    if (filled.length < 2) {
        section.innerHTML = `<div class="callout">Fill at least two hooks with items before practicing.</div>`;
        section.scrollIntoView({ behavior: "smooth" });
        return;
    }

    const dueCount = dueCountForList(palace, list);

    section.innerHTML = `
      <h2>Practice</h2>
      <div class="card">
        <p style="margin-top:0">Choose your retrieval setup. Performing the hook's physical gesture and saying or typing the answer <em>before</em> revealing multiplies retention without needing imagery.</p>
        <div class="practice-options">
          <div>
            <label for="cue-level">Cue fading (remove scaffolding)</label>
            <select id="cue-level">
              ${CUE_ORDER.map((k) => `<option value="${k}">${CUE_LABELS[k]}</option>`).join("")}
            </select>
          </div>
          <div>
            <label for="direction">Retrieval direction</label>
            <select id="direction">
              <option value="hook-to-item">Hook → Item (classic)</option>
              <option value="item-to-hook">Item → Hook (reverse lookup)</option>
              <option value="mixed">Mixed (both directions)</option>
            </select>
          </div>
          <div>
            <label for="response-mode">Recall method</label>
            <select id="response-mode">
              <option value="aloud">Say aloud (Production Effect)</option>
              <option value="type">Type it (strict written check)</option>
            </select>
          </div>
        </div>
        <div class="tabs" id="mode-tabs">
          ${Object.entries(MODES).map(([k, label]) =>
              `<button type="button" data-mode="${k}">${label}${k === "smart" && dueCount ? ` (${dueCount} due)` : ""}</button>`).join("")}
        </div>
      </div>
      <div id="stage"></div>`;
    section.scrollIntoView({ behavior: "smooth" });

    const cueSelect = section.querySelector("#cue-level");
    const dirSelect = section.querySelector("#direction");
    const respSelect = section.querySelector("#response-mode");
    cueSelect.value = list.stats.cueLevel || "full";
    dirSelect.value = list.stats.direction || "hook-to-item";
    respSelect.value = list.stats.responseMode || "aloud";

    section.querySelectorAll("#mode-tabs button").forEach((b) => {
        b.onclick = () => {
            const s = loadStore();
            const l = s.lists.find((x) => x.id === listId);
            if (l) {
                l.stats.cueLevel = cueSelect.value;
                l.stats.direction = dirSelect.value;
                l.stats.responseMode = respSelect.value;
                saveStore(s);
            }
            runSession(palace, listId, b.dataset.mode, cueSelect.value, dirSelect.value, respSelect.value);
        };
    });
}

function runSession(palace, listId, mode, cueLevel = "full", direction = "hook-to-item", responseMode = "aloud") {
    const store = loadStore();
    const encMode = effectiveEncodingMode(store);
    const list = store.lists.find((l) => l.id === listId);
    let order = palace.hooks.filter((h) => list.entries[h.n] && list.entries[h.n].item.trim());
    const perHook = (list.stats && list.stats.perHook) || {};

    if (mode === "smart") {
        // Due hooks first, sorted by lowest accuracy / lowest box, then rest if few are due
        const scored = order.slice().sort((a, b) => {
            const sa = perHook[a.n], sb = perHook[b.n];
            const da = isSrsDue(sa) ? 0 : 1;
            const db = isSrsDue(sb) ? 0 : 1;
            if (da !== db) return da - db;
            const accA = sa && sa.total ? sa.ok / sa.total : -1;
            const accB = sb && sb.total ? sb.ok / sb.total : -1;
            return accA - accB;
        });
        const dueOnly = scored.filter((h) => isSrsDue(perHook[h.n]));
        order = dueOnly.length >= 2 ? dueOnly : scored;
    } else if (mode === "reverse") {
        order = order.slice().reverse();
    } else if (mode === "randomstart") {
        const start = Math.floor(Math.random() * order.length);
        order = order.slice(start).concat(order.slice(0, start));
    } else if (mode === "shuffle") {
        order = order.slice();
        for (let i = order.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [order[i], order[j]] = [order[j], order[i]];
        }
    }

    const stage = document.getElementById("stage");
    document.querySelectorAll("#mode-tabs button").forEach((b) =>
        b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));

    let idx = 0;
    const results = [];

    function renderStep() {
        if (idx >= order.length) return renderSummary();
        const h = order[idx];
        const entry = list.entries[h.n];
        const stepDir = direction === "mixed"
            ? (Math.random() < 0.5 ? "hook-to-item" : "item-to-hook")
            : direction;

        let cueHtml = "";
        let promptLine = "";
        if (stepDir === "item-to-hook") {
            cueHtml = `<p class="beat"><strong>${escapeHtml(entry.item)}</strong></p>`;
            promptLine = "Which hook number &amp; anchor holds this item?";
        } else {
            cueHtml =
                cueLevel === "number" ? `<p class="beat"><span class="hooknum">${h.n}</span></p>`
                : cueLevel === "hook" ? `<p class="beat"><span class="hooknum">${h.n}</span><br><strong>${escapeHtml(h.label)}</strong></p>`
                : cueLevel === "hooktype" ? `<p class="beat"><span class="hooknum">${h.n}</span><br><strong>${escapeHtml(h.label)}</strong> ${hookTypeChip(h.type)}</p>`
                : `<p class="beat"><span class="hooknum">${h.n}</span><br>${hookBeatForMode(h, encMode)}</p>
                   <p><strong>${escapeHtml(h.label)}</strong> ${hookTypeChip(h.type)}</p>
                   ${h.enact ? `<div class="enact-cue" style="max-width:30em;margin:.3rem auto"><strong>Do it:</strong> ${escapeHtml(h.enact)}</div>` : ""}`;
            promptLine = responseMode === "type"
                ? "Type the item stored here before revealing."
                : "Say the item out loud (and perform the gesture if there is one).";
        }

        stage.innerHTML = `
          <div class="card practice-stage">
            <div class="progressbar"><div style="width:${(idx / order.length) * 100}%"></div></div>
            <p class="muted" style="margin:0">Hook ${h.n} of ${palace.hooks.length} · ${idx + 1}/${order.length} this walk</p>
            ${cueHtml}
            <p class="muted">${promptLine}</p>
            <div id="answer-zone">
              ${responseMode === "type"
                  ? `<form id="type-form" class="type-check">
                       <input type="text" id="typed-guess" autocomplete="off" placeholder="${stepDir === "item-to-hook" ? "Type hook name or number…" : "Type the item…"}">
                       <button type="submit" class="primary">Check</button>
                     </form>`
                  : `<button class="primary" id="reveal">Reveal</button>`}
            </div>
          </div>`;

        function showAnswer(typedValue = "") {
            const expected = stepDir === "item-to-hook" ? `${h.n} ${h.label}` : entry.item;
            let matchNote = "";
            if (typedValue.trim()) {
                const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
                const g = norm(typedValue);
                const exact = stepDir === "item-to-hook"
                    ? (g === String(h.n) || norm(h.label).includes(g) || g.includes(norm(h.label)))
                    : (norm(entry.item) === g || norm(entry.item).includes(g) && g.length >= 3);
                matchNote = `<p style="margin:.25rem 0"><span class="chip ${exact ? "good" : "warn"}">You typed: “${escapeHtml(typedValue)}” ${exact ? "· looks like a match!" : "· compare below"}</span></p>`;
            }
            document.getElementById("answer-zone").innerHTML = `
              ${matchNote}
              <div class="reveal-box">
                ${stepDir === "item-to-hook"
                    ? `<strong>Hook ${h.n}: ${escapeHtml(h.label)}</strong> ${hookTypeChip(h.type)}`
                    : `<strong>${escapeHtml(entry.item)}</strong>`}
                ${entry.assoc ? `<br><span class="muted">${escapeHtml(entry.assoc)}</span>` : ""}
                ${cueLevel !== "full" || stepDir === "item-to-hook"
                    ? `<br><span class="muted" style="font-style:italic">${hookBeatForMode(h, encMode)}</span>` : ""}
              </div>
              <div class="toolbar" style="justify-content:center">
                <button class="bad" id="r-miss">✗ Missed (review now)</button>
                <button class="warn" id="r-hard">~ Hard (hesitated)</button>
                <button class="good" id="r-good">✓ Got it</button>
              </div>`;
            document.getElementById("r-miss").onclick = () => grade(h, "miss");
            document.getElementById("r-hard").onclick = () => grade(h, "hard");
            document.getElementById("r-good").onclick = () => grade(h, "good");
        }

        if (responseMode === "type") {
            const input = document.getElementById("typed-guess");
            input.focus();
            document.getElementById("type-form").onsubmit = (e) => {
                e.preventDefault();
                showAnswer(input.value);
            };
        } else {
            document.getElementById("reveal").onclick = () => showAnswer("");
        }
    }

    function grade(h, rating) {
        results.push({ n: h.n, label: h.label, rating, ok: rating !== "miss" });
        idx++;
        renderStep();
    }

    function renderSummary() {
        const okCount = results.filter((r) => r.ok).length;
        const missed = results.filter((r) => r.rating === "miss");
        const hard = results.filter((r) => r.rating === "hard");

        const s = loadStore();
        const l = s.lists.find((x) => x.id === listId);
        l.stats.sessions = (l.stats.sessions || 0) + 1;
        l.stats.perHook = l.stats.perHook || {};
        for (const r of results) {
            l.stats.perHook[r.n] = updateSrsStats(l.stats.perHook[r.n], r.rating);
        }
        saveStore(s);

        const weakRows = Object.entries(l.stats.perHook)
            .map(([n, ph]) => ({
                n: Number(n),
                pct: ph.total ? Math.round((ph.ok / ph.total) * 100) : 0,
                next: formatNextDue(ph),
                ...ph,
            }))
            .sort((a, b) => a.pct - b.pct)
            .slice(0, 6);

        const pct = Math.round((okCount / results.length) * 100);
        const curCueIdx = CUE_ORDER.indexOf(cueLevel);
        const canFade = pct >= 90 && curCueIdx >= 0 && curCueIdx < CUE_ORDER.length - 1;
        const nextCue = canFade ? CUE_ORDER[curCueIdx + 1] : null;
        const reworkList = missed.concat(hard);

        const reworkHtml = reworkList.length ? `
          <div style="margin:1rem 0">
            <p><strong>Retrieval-powered repair:</strong> strengthen missed or hesitant hooks right now while the gap is fresh — add a clearer cause, gesture, rule, or pun:</p>
            ${reworkList.map((m) => {
                const h = palace.hooks.find((x) => x.n === m.n);
                const e = l.entries[m.n] || { item: "", assoc: "" };
                return `
                  <details class="rework-item" open>
                    <summary>#${m.n} ${escapeHtml(h.label)} → ${escapeHtml(e.item)} <span class="chip ${m.rating === "miss" ? "warn" : ""}">${m.rating}</span></summary>
                    <textarea rows="2" class="rework-input" data-rn="${m.n}" style="margin-top:.5rem">${escapeHtml(e.assoc)}</textarea>
                    <div class="coach" id="rcoach-${m.n}"></div>
                    <div class="toolbar" style="margin:.4rem 0 0">
                      <button type="button" class="chip-btn save-rework" data-rn="${m.n}">Save stronger link</button>
                      <span class="muted" id="rmsg-${m.n}" style="font-size:.82rem"></span>
                    </div>
                  </details>`;
            }).join("")}
          </div>` : "";

        stage.innerHTML = `
          <div class="card practice-stage">
            <div class="progressbar"><div style="width:100%"></div></div>
            <h3 style="margin-top:0">${okCount} / ${results.length} recalled (${pct}%)</h3>
            ${reworkList.length === 0
                ? `<p class="callout good" style="text-align:left">A clean walk! Spaced review intervals have been extended.</p>`
                : ""}
            ${canFade
                ? `<div class="callout" style="text-align:left">
                     <strong>Ready to fade cues?</strong> You scored ${pct}% at <em>${escapeHtml(CUE_LABELS[cueLevel])}</em>.
                     Try stepping down to <strong>${escapeHtml(CUE_LABELS[nextCue])}</strong> next walk so your memory holds without scaffolding.
                     <button type="button" class="chip-btn" id="step-down-cue" style="margin-left:.4rem">Switch cue level now</button>
                   </div>`
                : ""}
            ${reworkHtml}
            <table class="stats" style="margin:1rem auto;max-width:28rem">
              <thead><tr><th>Hook</th><th>Accuracy</th><th>Next review</th></tr></thead>
              <tbody>
                ${weakRows.map((w) => {
                    const hk = palace.hooks.find((x) => x.n === w.n);
                    return `<tr><td>${w.n} · ${escapeHtml(hk ? hk.label : "")}</td><td>${w.pct}% (${w.ok}/${w.total})</td><td>${w.next}</td></tr>`;
                }).join("")}
              </tbody>
            </table>
            <p class="muted" style="font-size:.85rem">${l.stats.sessions} practice walk${l.stats.sessions === 1 ? "" : "s"} on this list so far.</p>
            <div class="toolbar" style="justify-content:center">
              <button class="primary" id="again">Walk again</button>
              ${missed.length ? '<button id="retry-missed">Retry missed hooks now</button>' : ""}
            </div>
          </div>`;

        /* Bind inline rework editors */
        stage.querySelectorAll(".rework-input").forEach((ta) => {
            const n = Number(ta.dataset.rn);
            const h = palace.hooks.find((x) => x.n === n);
            const item = (l.entries[n] && l.entries[n].item) || "";
            const coachEl = document.getElementById("rcoach-" + n);
            renderCoachFeedback(coachEl, analyzeLink(ta.value, item, h.label));
            ta.addEventListener("input", () => {
                renderCoachFeedback(coachEl, analyzeLink(ta.value, item, h.label));
            });
        });
        stage.querySelectorAll(".save-rework").forEach((btn) => {
            btn.onclick = () => {
                const n = Number(btn.dataset.rn);
                const ta = stage.querySelector(`.rework-input[data-rn="${n}"]`);
                const st = loadStore();
                const li = st.lists.find((x) => x.id === listId);
                if (li) {
                    li.entries[n] = li.entries[n] || { item: "", assoc: "" };
                    li.entries[n].assoc = ta.value.trim();
                    li.updatedAt = new Date().toISOString();
                    saveStore(st);
                    // Also sync main editor textarea if present
                    const mainTa = document.getElementById("assoc-" + n);
                    if (mainTa) mainTa.value = ta.value.trim();
                    document.getElementById("rmsg-" + n).textContent = "Saved!";
                }
            };
        });

        const stepDown = document.getElementById("step-down-cue");
        if (stepDown) {
            stepDown.onclick = () => {
                const st = loadStore();
                const li = st.lists.find((x) => x.id === listId);
                if (li) { li.stats.cueLevel = nextCue; saveStore(st); }
                beginPractice(palace, listId);
            };
        }
        const retryMissed = document.getElementById("retry-missed");
        if (retryMissed) {
            retryMissed.onclick = () => runSession(palace, listId, "smart", cueLevel, direction, responseMode);
        }
        document.getElementById("again").onclick = () => beginPractice(palace, listId);
    }

    renderStep();
}

/* ---------- Router ---------- */

const palaceId = params.get("p");
const listId = params.get("l");
const currentPalace = palaceId ? getPalace(loadStore(), palaceId) : null;

if (currentPalace && listId) viewList(currentPalace, listId);
else if (currentPalace) viewPalace(currentPalace);
else viewPicker();
</script>
